<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS-Scape: The Core Simulation Game</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<main id="title" class="screen active">
  <svg class="ship" viewBox="0 0 400 120" aria-hidden="true">
    <ellipse cx="200" cy="50" rx="190" ry="38" fill="#2a2f55"/>
    <ellipse cx="200" cy="38" rx="95" ry="30" fill="#3a4180"/>
    <ellipse cx="200" cy="30" rx="48" ry="18" fill="#5ce1ff" opacity=".35"/>
    <circle cx="70" cy="62" r="6" fill="#5ce1ff"/><circle cx="130" cy="74" r="6" fill="#5ce1ff"/>
    <circle cx="200" cy="80" r="7" fill="#5ce1ff"/><circle cx="270" cy="74" r="6" fill="#5ce1ff"/>
    <circle cx="330" cy="62" r="6" fill="#5ce1ff"/>
  </svg>
  <div class="beam"></div>
  <div class="astro" role="img" aria-label="Astronot melayang di luar angkasa">
    <svg viewBox="0 0 120 160">
      <rect x="22" y="58" width="22" height="50" rx="8" fill="#c9d3ee"/>
      <rect x="34" y="54" width="52" height="64" rx="18" fill="#ff8a3d"/>
      <rect x="40" y="82" width="40" height="12" rx="4" fill="#d96a1f"/>
      <rect x="22" y="70" width="18" height="40" rx="9" fill="#ff8a3d" transform="rotate(18 31 90)"/>
      <rect x="80" y="70" width="18" height="40" rx="9" fill="#ff8a3d" transform="rotate(-22 89 90)"/>
      <rect x="38" y="108" width="20" height="40" rx="9" fill="#ff8a3d" transform="rotate(8 48 128)"/>
      <rect x="62" y="108" width="20" height="40" rx="9" fill="#ff8a3d" transform="rotate(-10 72 128)"/>
      <circle cx="60" cy="38" r="30" fill="#eef3ff"/>
      <ellipse cx="60" cy="38" rx="21" ry="17" fill="#1d1245"/>
      <ellipse cx="53" cy="33" rx="7" ry="4" fill="#5ce1ff" opacity=".7"/>
    </svg>
  </div>
  <div class="menu">
    <h1>OS-Scape</h1>
    <p class="tagline">The Core Simulation Game</p>
    <button id="start" type="button">START</button>
  </div>
</main>

<section id="story" class="screen" aria-live="polite">
  <p id="line"></p>
  <p id="hint"></p>
  <div class="nav">
    <button id="skip" class="ghost" type="button">Lewati</button>
    <button id="next" type="button">LANJUT</button>
  </div>
</section>

<div id="flash"></div>

<script src="js/core.js"></script>
<script src="js/navigation.js"></script>
<script src="js/engine/scheduling.js"></script>
<script src="js/engine/ipc.js"></script>
<script src="js/engine/concurrency.js"></script>
<script src="js/engine/sync.js"></script>
<script src="js/engine/memory.js"></script>
<script src="js/stages/stage1.js"></script>
<script src="js/stages/stage2.js"></script>
<script src="js/stages/stage3.js"></script>
<script src="js/stages/stage4.js"></script>
<script src="js/stages/stage5.js"></script>
<script src="js/results.js"></script>
<script src="js/main.js"></script>
</body>
</html>
